<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SUPPORTAI | Login</title>


    <style>

        /* =========================================
           GLOBAL RESET
           ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           BODY
           ========================================= */

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #eef1f4;

            color: #25282d;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        /* =========================================
           LOGIN CARD
           ========================================= */

        .login-container {

            width: 430px;

            padding: 45px;

            background: #ffffff;

            border: 1px solid #d9dde3;

            border-radius: 20px;

            box-shadow:
                0 18px 45px
                rgba(0, 0, 0, 0.09);

        }


        /* =========================================
           LOGO
           ========================================= */

        .logo {

            text-align: center;

            margin-bottom: 30px;

        }


        /* RED LOGO ICON */

        .logo-icon {

            width: 65px;

            height: 65px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #dc2626;

            color: #ffffff;

            border-radius: 16px;

            font-size: 30px;

            font-weight: bold;

            box-shadow:
                0 8px 22px
                rgba(220, 38, 38, 0.20);

        }


        /* SUPPORTAI TEXT */

        .logo h1 {

            margin-top: 18px;

            font-size: 26px;

            letter-spacing: 3px;

            color: #25282d;

        }


        /* AI RED */

        .logo h1 span {

            color: #dc2626;

        }


        /* SUBTITLE */

        .logo p {

            margin-top: 8px;

            color: #7b818a;

            font-size: 12px;

            letter-spacing: 2px;

        }


        /* =========================================
           WELCOME TEXT
           ========================================= */

        h2 {

            text-align: center;

            margin-bottom: 8px;

            font-size: 24px;

            color: #25282d;

        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 30px;

        }


        /* =========================================
           FORM
           ========================================= */

        .form-group {

            margin-bottom: 20px;

        }


        /* LABEL */

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            color: #374151;

            font-weight: 600;

        }


        /* INPUT */

        input {

            width: 100%;

            padding: 14px 15px;

            background: #f5f6f8;

            border: 1px solid #d9dde3;

            border-radius: 9px;

            color: #25282d;

            outline: none;

            font-size: 14px;

            transition: all 0.25s ease;

        }


        /* PLACEHOLDER */

        input::placeholder {

            color: #9ca3af;

        }


        /* INPUT FOCUS */

        input:focus {

            background: #ffffff;

            border-color: #dc2626;

            box-shadow:
                0 0 0 3px
                rgba(220, 38, 38, 0.10);

        }


        /* =========================================
           LOGIN BUTTON
           ========================================= */

        button {

            width: 100%;

            padding: 15px;

            margin-top: 8px;

            border: none;

            border-radius: 9px;

            background: #dc2626;

            color: #ffffff;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            transition: all 0.25s ease;

        }


        /* BUTTON HOVER */

        button:hover {

            background: #b91c1c;

            transform: translateY(-1px);

            box-shadow:
                0 8px 22px
                rgba(220, 38, 38, 0.20);

        }


        /* BUTTON CLICK */

        button:active {

            transform: translateY(0);

        }


        /* =========================================
           ERROR MESSAGE
           ========================================= */

        .message {

            margin-bottom: 18px;

            padding: 11px;

            border-radius: 8px;

            background: #fef2f2;

            color: #b91c1c;

            border: 1px solid #fecaca;

            text-align: center;

            font-size: 13px;

        }


        /* =========================================
           SIGNUP AREA
           ========================================= */

        .signup {

            text-align: center;

            margin-top: 25px;

            color: #6b7280;

            font-size: 14px;

        }


        /* CREATE ACCOUNT */

        .signup a {

            color: #dc2626;

            text-decoration: none;

            font-weight: bold;

        }


        .signup a:hover {

            color: #b91c1c;

            text-decoration: underline;

        }


        /* =========================================
           SECURITY
           ========================================= */

        .security {

            text-align: center;

            margin-top: 25px;

            color: #9ca3af;

            font-size: 11px;

        }


        /* =========================================
           MOBILE RESPONSIVE
           ========================================= */

        @media (max-width: 500px) {

            .login-container {

                width: calc(100% - 30px);

                padding: 32px 25px;

            }

            .logo-icon {

                width: 58px;

                height: 58px;

                font-size: 26px;

            }

            .logo h1 {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         LOGIN CARD
         ========================================= -->

    <div class="login-container">


        <!-- LOGO -->

        <div class="logo">


            <div class="logo-icon">

                ✦

            </div>


            <h1>

                SUPPORT<span>AI</span>

            </h1>


            <p>

                INTELLIGENT CUSTOMER SUPPORT

            </p>


        </div>


        <!-- WELCOME -->

        <h2>

            Welcome Back

        </h2>


        <p class="subtitle">

            Sign in to your support command center

        </p>


        <!-- ERROR MESSAGE -->

        {% if error %}

        <div class="message">

            {{ error }}

        </div>

        {% endif %}


        <!-- =====================================
             LOGIN FORM
             ===================================== -->

        <form method="POST"
              action="{{ url_for('login') }}">


            <!-- EMAIL -->

            <div class="form-group">

                <label>

                    Email Address

                </label>


                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>

                    Password

                </label>


                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- LOGIN -->

            <button type="submit">

                SIGN IN →

            </button>


        </form>


        <!-- SIGNUP -->

        <div class="signup">

            Don't have an account?

            <a href="{{ url_for('signup') }}">

                Create Account

            </a>

        </div>


        <!-- SECURITY -->

        <div class="security">

            🔒 Secure authentication • SUPPORTAI

        </div>


    </div>


</body>

</html>

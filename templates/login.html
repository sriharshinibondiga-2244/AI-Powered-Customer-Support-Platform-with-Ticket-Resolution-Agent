<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SUPPORTAI | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at top left,
                    #292000,
                    #080808 40%
                );

            color: #f5f5f5;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .login-container {

            width: 430px;

            padding: 45px;

            background: rgba(17, 17, 17, 0.96);

            border: 1px solid #292929;

            border-radius: 20px;

            box-shadow:
                0 0 50px rgba(212, 175, 55, 0.12);

        }

        .logo {

            text-align: center;

            margin-bottom: 30px;
        }

        .logo-icon {

            width: 65px;
            height: 65px;

            margin: auto;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #d4af37;

            color: #080808;

            border-radius: 16px;

            font-size: 30px;

            font-weight: bold;

            box-shadow:
                0 0 25px rgba(212, 175, 55, 0.25);
        }

        .logo h1 {

            margin-top: 18px;

            font-size: 26px;

            letter-spacing: 3px;
        }

        .logo h1 span {

            color: #d4af37;
        }

        .logo p {

            margin-top: 8px;

            color: #777;

            font-size: 12px;

            letter-spacing: 2px;
        }

        h2 {

            text-align: center;

            margin-bottom: 8px;

            font-size: 24px;
        }

        .subtitle {

            text-align: center;

            color: #888;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            color: #cfcfcf;
        }

        input {

            width: 100%;

            padding: 14px 15px;

            background: #0b0b0b;

            border: 1px solid #303030;

            border-radius: 9px;

            color: white;

            outline: none;

            font-size: 14px;

            transition: 0.3s;
        }

        input:focus {

            border-color: #d4af37;

            box-shadow:
                0 0 0 2px
                rgba(212, 175, 55, 0.08);
        }

        button {

            width: 100%;

            padding: 15px;

            margin-top: 8px;

            border: none;

            border-radius: 9px;

            background: #d4af37;

            color: #080808;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            background: #f0d77a;

            transform: translateY(-1px);

            box-shadow:
                0 8px 25px
                rgba(212, 175, 55, 0.2);
        }

        .message {

            margin-bottom: 18px;

            padding: 10px;

            border-radius: 7px;

            background: #2a1717;

            color: #ff8c8c;

            text-align: center;

            font-size: 13px;
        }

        .signup {

            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 14px;
        }

        .signup a {

            color: #d4af37;

            text-decoration: none;

            font-weight: bold;
        }

        .signup a:hover {

            text-decoration: underline;
        }

        .security {

            text-align: center;

            margin-top: 25px;

            color: #555;

            font-size: 11px;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">

            <div class="logo-icon">
                ✦
            </div>

            <h1>
                SUPPORT<span>AI</span>
            </h1>

            <p>
                INTELLIGENT CUSTOMER SUPPORT
            </p>

        </div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Sign in to your support command center
        </p>

        {% if error %}

        <div class="message">
            {{ error }}
        </div>

        {% endif %}

       <form method="POST"
      action="{{ url_for('login') }}">

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button type="submit">

                SIGN IN →

            </button>

        </form>

        <div class="signup">

            Don't have an account?

            <a href="{{ url_for('signup') }}">
    Create Account
</a>

        </div>

        <div class="security">

            🔒 Secure authentication • SUPPORTAI

        </div>

    </div>

</body>

</html>

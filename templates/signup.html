<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SUPPORTAI | Create Account</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at top right,
                    #292000,
                    #080808 42%
                );

            color: #f5f5f5;

            font-family: Arial, Helvetica, sans-serif;
        }

        .container {

            width: 440px;

            padding: 40px;

            background: #111111;

            border: 1px solid #292929;

            border-radius: 20px;

            box-shadow:
                0 0 50px
                rgba(212, 175, 55, 0.12);
        }

        .logo {

            text-align: center;

            margin-bottom: 25px;
        }

        .logo-icon {

            width: 58px;
            height: 58px;

            margin: auto;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #d4af37;

            color: #080808;

            border-radius: 14px;

            font-size: 27px;
        }

        .logo h1 {

            margin-top: 15px;

            letter-spacing: 3px;

            font-size: 24px;
        }

        .logo span {

            color: #d4af37;
        }

        h2 {

            text-align: center;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #888;

            font-size: 13px;

            margin-bottom: 25px;
        }

        .group {

            margin-bottom: 17px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;
        }

        input {

            width: 100%;

            padding: 13px;

            background: #090909;

            border: 1px solid #303030;

            color: white;

            border-radius: 8px;

            outline: none;
        }

        input:focus {

            border-color: #d4af37;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #d4af37;

            color: #080808;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            margin-top: 8px;
        }

        button:hover {

            background: #f0d77a;
        }

        .error {

            background: #2a1717;

            color: #ff9999;

            padding: 10px;

            border-radius: 7px;

            text-align: center;

            font-size: 13px;

            margin-bottom: 15px;
        }

        .login {

            text-align: center;

            color: #777;

            margin-top: 22px;

            font-size: 14px;
        }

        .login a {

            color: #d4af37;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">

            <div class="logo-icon">
                ✦
            </div>

            <h1>
                SUPPORT<span>AI</span>
            </h1>

        </div>

        <h2>Create Account</h2>

        <p class="subtitle">
            Join the intelligent support platform
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST"
              action="/signup">

            <div class="group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>

            <div class="group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>

            <div class="group">

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>

            <button type="submit">

                CREATE ACCOUNT →

            </button>

        </form>

        <div class="login">

            Already have an account?

            <a href="/login">
                Sign In
            </a>

        </div>

    </div>

</body>

</html>

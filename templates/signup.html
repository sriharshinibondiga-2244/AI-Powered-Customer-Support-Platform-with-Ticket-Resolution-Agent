<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SUPPORTAI | Create Account</title>


    <style>

        /* =========================================
           RESET
           ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           BODY
           ========================================= */

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #eef1f4;

            color: #25282d;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            padding: 30px;

        }


        /* =========================================
           SIGNUP CARD
           ========================================= */

        .signup-container {

            width: 450px;

            padding: 42px;

            background: #ffffff;

            border: 1px solid #d9dde3;

            border-radius: 20px;

            box-shadow:
                0 18px 45px
                rgba(0, 0, 0, 0.09);

        }


        /* =========================================
           LOGO
           ========================================= */

        .logo {

            text-align: center;

            margin-bottom: 28px;

        }


        .logo-icon {

            width: 62px;

            height: 62px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #dc2626;

            color: #ffffff;

            border-radius: 15px;

            font-size: 28px;

            font-weight: bold;

            box-shadow:
                0 8px 22px
                rgba(220, 38, 38, 0.20);

        }


        .logo h1 {

            margin-top: 16px;

            font-size: 26px;

            letter-spacing: 3px;

            color: #25282d;

        }


        .logo h1 span {

            color: #dc2626;

        }


        .logo p {

            margin-top: 7px;

            color: #7b818a;

            font-size: 12px;

            letter-spacing: 2px;

        }


        /* =========================================
           TITLE
           ========================================= */

        h2 {

            text-align: center;

            margin-bottom: 8px;

            font-size: 24px;

            color: #25282d;

        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 26px;

        }


        /* =========================================
           FORM
           ========================================= */

        .form-group {

            margin-bottom: 17px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #374151;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            background: #f5f6f8;

            border: 1px solid #d9dde3;

            border-radius: 9px;

            color: #25282d;

            outline: none;

            font-size: 14px;

            transition: all 0.25s ease;

        }


        input::placeholder {

            color: #9ca3af;

        }


        input:focus {

            background: #ffffff;

            border-color: #dc2626;

            box-shadow:
                0 0 0 3px
                rgba(220, 38, 38, 0.10);

        }


        /* =========================================
           CREATE ACCOUNT BUTTON
           ========================================= */

        button {

            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 9px;

            background: #dc2626;

            color: #ffffff;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            transition: all 0.25s ease;

        }


        button:hover {

            background: #b91c1c;

            transform: translateY(-1px);

            box-shadow:
                0 8px 22px
                rgba(220, 38, 38, 0.20);

        }


        /* =========================================
           ERROR MESSAGE
           ========================================= */

        .message,
        .error {

            margin-bottom: 18px;

            padding: 11px;

            border-radius: 8px;

            background: #fef2f2;

            color: #b91c1c;

            border: 1px solid #fecaca;

            text-align: center;

            font-size: 13px;

        }


        /* =========================================
           LOGIN LINK
           ========================================= */

        .login {

            text-align: center;

            margin-top: 23px;

            color: #6b7280;

            font-size: 14px;

        }


        .login a {

            color: #dc2626;

            text-decoration: none;

            font-weight: bold;

        }


        .login a:hover {

            color: #b91c1c;

            text-decoration: underline;

        }


        /* =========================================
           SECURITY
           ========================================= */

        .security {

            text-align: center;

            margin-top: 22px;

            color: #9ca3af;

            font-size: 11px;

        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 500px) {

            body {

                padding: 15px;

            }

            .signup-container {

                width: 100%;

                padding: 30px 25px;

            }

        }

    </style>

</head>


<body>


    <div class="signup-container">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">

                ✦

            </div>


            <h1>

                SUPPORT<span>AI</span>

            </h1>


            <p>

                INTELLIGENT CUSTOMER SUPPORT

            </p>

        </div>


        <!-- TITLE -->

        <h2>

            Create Account

        </h2>


        <p class="subtitle">

            Join the intelligent support platform

        </p>


        <!-- ERROR -->

        {% if error %}

        <div class="message">

            {{ error }}

        </div>

        {% endif %}


        <!-- =====================================
             SIGNUP FORM
             ===================================== -->

        <form method="POST"
              action="{{ url_for('signup') }}">


            <!-- NAME -->

            <div class="form-group">

                <label>

                    Full Name

                </label>


                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>

                    Email Address

                </label>


                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>

                    Password

                </label>


                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label>

                    Confirm Password

                </label>


                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <!-- BUTTON -->

            <button type="submit">

                CREATE ACCOUNT →

            </button>


        </form>


        <!-- LOGIN -->

        <div class="login">

            Already have an account?

            <a href="{{ url_for('login') }}">

                Sign In

            </a>

        </div>


        <!-- SECURITY -->

        <div class="security">

            🔒 Secure authentication • SUPPORTAI

        </div>


    </div>


</body>

</html>
